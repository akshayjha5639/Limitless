name: Deploy to VPS

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          script_stop: true
          script: |
            cd /var/www/limitless-model
            git fetch origin
            git reset --hard origin/main

            # Clear any stale flag overrides so production runs on the code
            # defaults (all reporting features on). Rewrites only these keys
            # and preserves everything else in .env, notably GEMINI_API_KEY.
            # Idempotent: safe to run on every deploy.
            grep -vE '^(SCORING_MODEL_VERSION|ENABLE_CONFIDENCE_INTERVALS|ENABLE_VALIDITY_CHECKS|ENABLE_RELIABLE_CHANGE|ENABLE_METHODOLOGY_PAGE)=' .env > .env.new 2>/dev/null || true
            mv .env.new .env
            chmod 600 .env

            venv/bin/pip install -r requirements.txt
            sudo systemctl restart limitless-model

            # Fail the deploy loudly if a reporting feature came up disabled.
            venv/bin/python -c "from app.core.config import settings as s; assert s.ENABLE_CONFIDENCE_INTERVALS and s.ENABLE_VALIDITY_CHECKS and s.ENABLE_RELIABLE_CHANGE and s.ENABLE_METHODOLOGY_PAGE; print('live config OK: all reporting features enabled')"
